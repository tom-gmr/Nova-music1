
name: Build Music Nova Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-migration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle with retry
        run: |
          set -e
          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            https://service.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          export PATH="/opt/gradle-9.3.1/bin:$PATH"
          gradle --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Fix Android 37 platform directory
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Nova-Native-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
