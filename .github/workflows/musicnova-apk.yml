name: Build MusicNova APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check files
        run: |
          test -f index.html || (echo "index.html repo ke root me nahi hai" && exit 1)
          test -f logo.jpg || (echo "logo.jpg repo ke root me nahi hai" && exit 1)

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp logo.jpg www/logo.jpg
          cat > package.json <<'JSON'
          {
            "name": "musicnova",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/android": "^6.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.musicnova.app",
            "appName": "MusicNova",
            "webDir": "www",
            "backgroundColor": "#05000c"
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Icon, dark bars, privacy patch
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob, os, re, sys
          from PIL import Image, ImageDraw, ImageStat
          RES = "android/app/src/main/res"
          im = Image.open("logo.jpg").convert("RGB")
          w, h = im.size; s = min(w, h)
          im = im.crop(((w-s)//2, (h-s)//2, (w-s)//2+s, (h-s)//2+s))
          ring = Image.new("L", im.size, 0); d = ImageDraw.Draw(ring)
          d.rectangle([0,0,s,s], fill=255); d.rectangle([s*.08,s*.08,s*.92,s*.92], fill=0)
          mean = ImageStat.Stat(im, ring).mean
          bg = tuple(int(c*0.8) for c in mean)
          hexbg = "#FF%02X%02X%02X" % bg
          # adaptive foreground (own files, independent of template names)
          fg = Image.new("RGBA", (432,432), bg+(255,))
          fg.paste(im.resize((288,288), Image.LANCZOS), (72,72))
          os.makedirs(RES+"/drawable-nodpi", exist_ok=True)
          fg.save(RES+"/drawable-nodpi/mn_fg.png")
          open(RES+"/values/mn_colors.xml","w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<color name="mn_icon_bg">%s</color>\n<color name="mn_dark">#FF05000C</color>\n</resources>\n' % hexbg)
          adaptive = ('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
           '<background android:drawable="@color/mn_icon_bg" />\n<foreground android:drawable="@drawable/mn_fg" />\n</adaptive-icon>\n')
          os.makedirs(RES+"/mipmap-anydpi-v26", exist_ok=True)
          for n in ("ic_launcher","ic_launcher_round"):
              open(RES+"/mipmap-anydpi-v26/%s.xml" % n,"w").write(adaptive)
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for dens,px in sizes.items():
              base = im.resize((px,px), Image.LANCZOS).convert("RGBA")
              m1 = Image.new("L",(px*4,px*4),0); ImageDraw.Draw(m1).rounded_rectangle([0,0,px*4-1,px*4-1], radius=px*4//6, fill=255)
              sq = base.copy(); sq.putalpha(m1.resize((px,px), Image.LANCZOS))
              m2 = Image.new("L",(px*4,px*4),0); ImageDraw.Draw(m2).ellipse([0,0,px*4-1,px*4-1], fill=255)
              rd = base.copy(); rd.putalpha(m2.resize((px,px), Image.LANCZOS))
              os.makedirs("%s/mipmap-%s" % (RES,dens), exist_ok=True)
              sq.save("%s/mipmap-%s/ic_launcher.png" % (RES,dens))
              rd.save("%s/mipmap-%s/ic_launcher_round.png" % (RES,dens))
              # stale template foreground pngs could clash with nothing now, leave them
          # dark status/nav bars + window background
          st = RES+"/values/styles.xml"
          s = open(st).read()
          items = ('<item name="android:statusBarColor">@color/mn_dark</item>'
                   '<item name="android:navigationBarColor">@color/mn_dark</item>'
                   '<item name="android:windowBackground">@color/mn_dark</item>')
          n = 0
          for name in ("AppTheme.NoActionBar","AppTheme"):
              m = re.search(r'(<style\s+name="%s"[^>]*>)' % re.escape(name), s)
              if m:
                  s = s[:m.end()] + items + s[m.end():]; n += 1
          if n == 0:
              print("WARNING: theme not found, bars keep default")
          open(st,"w").write(s)
          # privacy: no cloud backup of app data
          mf = "android/app/src/main/AndroidManifest.xml"
          t = open(mf).read()
          t = t.replace('android:allowBackup="true"','android:allowBackup="false"')
          open(mf,"w").write(t)
          print("MusicNova patch done", hexbg)
          PY

      - name: Install stable signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MusicNova.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MusicNova-APK
          path: MusicNova.apk
