name: Build Music Nova Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-migration

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Fix Android 37 platform directory
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Cache stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicnova-debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"

            if gradle assembleDebug --no-daemon; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi

            echo "Retrying in 20 seconds..."
            sleep 20
          done

      - name: Show Debug SHA Fingerprints
        run: gradle signingReport --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Nova-Native-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
